name: Sync Pencil Research upstream

on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pencilresearch-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge validated upstream changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge Pencil Research main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pencilresearch/midi.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "FORK_UP_TO_DATE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main

      - name: Set up Deno
        if: env.FORK_UP_TO_DATE != 'true'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Validate the merged dataset and sync policy
        if: env.FORK_UP_TO_DATE != 'true'
        working-directory: .github/tests
        run: deno task check

      - name: Publish the validated merge
        if: env.FORK_UP_TO_DATE != 'true'
        run: git push origin HEAD:main
